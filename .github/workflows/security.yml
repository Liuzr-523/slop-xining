name: Secret and privacy scan
on:
  # 西宁版直接从 main 分支发布到 GitHub Pages；武汉版的构建与测试流程改为仅手动触发
  workflow_dispatch:

permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks and scan files plus history
        run: python3 tools/security_check.py --install-scanner
